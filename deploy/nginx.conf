server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # /studio → /studio/ без схемы и порта: за Traefik nginx видит http и порт 80.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # add_header внутри location отменяет заголовки уровня server, поэтому они заданы в каждом блоке.
    # Страницы всегда свежие, чтобы правки были видны сразу.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # CSS и JS подключаются с ?v=N — при правке номер поднимается, поэтому их можно кешировать надолго.
    # Картинки и видео меняются редко: неделя.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Английская версия раньше жила в /en/, теперь она основная и лежит в корне.
    location = /en { return 301 /; }
    location ^~ /en/ { rewrite ^/en/(.*)$ /$1 permanent; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

# Один адрес у сайта: www перенаправляется на домен без www.
server {
    listen 80;
    server_name www.thronestudios.ink;
    server_tokens off;
    return 301 https://thronestudios.ink$request_uri;
}
